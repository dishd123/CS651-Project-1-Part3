<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact | StudyBoard</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/site.css"></head>
<body><div id="site-nav"></div><main><section class="page-hero container"><p class="eyebrow">SAY HELLO</p><h1>Bring your questions to the board.</h1><p class="lead narrow">We are shaping StudyBoard for students, instructors, and curious teams. Tell us what would make your next study session better.</p></section><section class="container pb-5"><div class="row g-5"><div class="col-lg-7"><form class="contact-form" id="contact-form"><label for="name">Name</label><input id="name" class="form-control" required placeholder="Your name"><label for="email">Email</label><input id="email" type="email" class="form-control" required placeholder="you@example.com"><label for="message">Message</label><textarea id="message" class="form-control" rows="5" required placeholder="How can StudyBoard help?"></textarea><button class="btn btn-primary mt-3" type="submit">Send message</button><p id="contact-status" class="form-status" aria-live="polite"></p></form></div><div class="col-lg-5">
    <img class="site-photo" src="/images/contact.jpg" alt="A classroom whiteboard full of notes">
    <div class="contact-note"><strong>StudyBoard studio</strong><br>Computer Vision + ML for better learning<br><a href="mailto:hello@studyboard.tech">hello@studyboard.tech</a></div></div></div></section></main><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script type="module" src="/js/site.js"></script></body></html>
